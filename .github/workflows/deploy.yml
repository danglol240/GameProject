name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'portal/**'
      - 'pokemon/**'
      - 'k8s/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/danglol240/.kube/config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Patch kubeconfig để bypass TLS cert timing issue ─────────
      - name: Bypass k3s TLS verify
        run: |
          CLUSTER=$(kubectl config view -o jsonpath='{.clusters[0].name}')
          kubectl config set-cluster "$CLUSTER" --insecure-skip-tls-verify=true
          kubectl config unset clusters."$CLUSTER".certificate-authority-data 2>/dev/null || true
          kubectl cluster-info

      # ── Build images ──────────────────────────────────────────────
      - name: Build platformer image
        run: docker build -t dbct-game-client:${{ github.sha }} ./client

      - name: Build portal image
        run: docker build -t game-portal:${{ github.sha }} ./portal

      - name: Build pokemon image
        run: docker build -t pokemon-game:${{ github.sha }} ./pokemon

      # ── Import into k3s containerd ────────────────────────────────
      - name: Import platformer into k3s
        run: docker save dbct-game-client:${{ github.sha }} | sudo /usr/local/bin/k3s ctr images import -

      - name: Import portal into k3s
        run: docker save game-portal:${{ github.sha }} | sudo /usr/local/bin/k3s ctr images import -

      - name: Import pokemon into k3s
        run: docker save pokemon-game:${{ github.sha }} | sudo /usr/local/bin/k3s ctr images import -

      # ── Xóa ingress cũ bị conflict ───────────────────────────────
      - name: Remove legacy ingresses
        run: |
          kubectl -n games delete ingress dbct-game --ignore-not-found=true
          kubectl -n games delete ingress game-ingress --ignore-not-found=true

      # ── Apply k8s manifests ───────────────────────────────────────
      - name: Apply k8s manifests
        run: kubectl apply --validate=false -f k8s/

      # ── Trigger rollouts với image tag mới ───────────────────────
      - name: Update platformer image
        run: kubectl -n games set image deployment/dbct-game dbct-game=dbct-game-client:${{ github.sha }}

      - name: Update portal image
        run: kubectl -n games set image deployment/game-portal game-portal=game-portal:${{ github.sha }}

      - name: Update pokemon image
        run: kubectl -n games set image deployment/pokemon-game pokemon-game=pokemon-game:${{ github.sha }}

      # ── Đợi rollout hoàn tất ──────────────────────────────────────
      - name: Wait for platformer rollout
        run: kubectl -n games rollout status deployment/dbct-game --timeout=120s

      - name: Wait for portal rollout
        run: kubectl -n games rollout status deployment/game-portal --timeout=120s

      - name: Wait for pokemon rollout
        run: kubectl -n games rollout status deployment/pokemon-game --timeout=120s

      # ── Don anh cu trong containerd cua k3s, tranh day dia theo thoi gian ──
      # CHI xoa anh KHONG con duoc deployment nao tham chieu (tranh xoa nham
      # ban dang chay nhu su co da gap truoc day)
      - name: Prune old k3s images (keep in-use tags)
        run: |
          KEEP=$(kubectl -n games get deploy -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}{"\n"}{end}')
          sudo /usr/local/bin/k3s ctr images ls -q \
            | grep -E "^docker.io/library/(dbct-game-client|game-portal|pokemon-game):" \
            | sed 's#^docker.io/library/##' \
            | while read -r img; do
                if ! grep -qxF "$img" <<< "$KEEP"; then
                  echo "Removing unused image: $img"
                  sudo /usr/local/bin/k3s ctr images rm "docker.io/library/$img" || true
                fi
              done
