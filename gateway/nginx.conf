server {
    listen 80;

    # Resolve at request time so the site still starts when the tunnel is down
    resolver 127.0.0.11 valid=10s;

    # Keep redirects relative: nginx only sees plain HTTP behind the tunnel
    absolute_redirect off;

    location = /horizon {
        return 302 /auth/login/;
    }

    location /horizon/ {
        return 302 /auth/login/;
    }

    # Horizon runs with WEBROOT='/', so its top-level paths are routed directly
    location ~ ^/(auth|static|project|admin|identity|settings|api|ngdetails|home|header|i18n|jsi18n)(/|$) {
        set $horizon_upstream http://horizon-tunnel:8081;
        proxy_pass $horizon_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Horizon sees plain HTTP, so Django's CSRF check needs a matching Origin
        proxy_set_header Origin http://$host;
        proxy_read_timeout 120s;
    }

    location /platformer/ {
        proxy_pass http://platformer/;
        proxy_set_header Host $host;
    }

    location /pokemon/ {
        proxy_pass http://pokemon/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://portal/;
        proxy_set_header Host $host;
    }
}
