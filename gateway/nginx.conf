# Behind the Cloudflare tunnel every request comes from one container IP,
# so rate-limit per real client address instead
map $http_cf_connecting_ip $cmp_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $cmp_client zone=cmp_login:1m rate=20r/m;

server {
    listen 80;

    # Resolve at request time so the site still starts when the tunnel is down
    resolver 127.0.0.11 valid=10s;

    # Keep redirects relative: nginx only sees plain HTTP behind the tunnel
    absolute_redirect off;

    # ── Cloud Management Platform ──────────────────
    location = /cloud {
        return 302 /cloud/;
    }

    location ~ ^/cloud/(?<cmp_path>.*)$ {
        set $cmp_upstream http://cmp;
        proxy_pass $cmp_upstream/$cmp_path$is_args$args;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Only these OpenStack API calls are reachable from the Internet.
    # Every one of them still needs a valid Keystone token.
    location ~ ^/cmp-api/identity(?<p>/v3/auth/(tokens|projects))$ {
        limit_req zone=cmp_login burst=10 nodelay;
        limit_req_status 429;
        limit_except GET POST { deny all; }
        set $up http://horizon-tunnel:8082;
        proxy_pass $up$p$is_args$args;
        proxy_read_timeout 120s;
    }

    location ~ "^/cmp-api/compute(?<p>/v2\.1/(servers/detail|flavors/detail|limits|os-hypervisors/detail|servers/[0-9a-fA-F-]{36}/action))$" {
        limit_except GET POST { deny all; }
        set $up http://horizon-tunnel:8083;
        proxy_pass $up$p$is_args$args;
        proxy_read_timeout 120s;
    }

    location ~ "^/cmp-api/volume(?<p>/v3/[0-9a-f]{32}/(volumes/detail|limits|scheduler-stats/get_pools))$" {
        limit_except GET { deny all; }
        set $up http://horizon-tunnel:8084;
        proxy_pass $up$p$is_args$args;
        proxy_read_timeout 120s;
    }

    location ~ ^/cmp-api/network(?<p>/v2\.0/(networks|subnets|routers|floatingips))$ {
        limit_except GET { deny all; }
        set $up http://horizon-tunnel:8085;
        proxy_pass $up$p$is_args$args;
        proxy_read_timeout 120s;
    }

    location ~ ^/cmp-api/image(?<p>/v2/images)$ {
        limit_except GET { deny all; }
        set $up http://horizon-tunnel:8086;
        proxy_pass $up$p$is_args$args;
        proxy_read_timeout 120s;
    }

    location /cmp-api/ {
        return 404;
    }

    location = /horizon {
        return 302 /auth/login/;
    }

    location /horizon/ {
        return 302 /auth/login/;
    }

    # Horizon runs with WEBROOT='/', so its top-level paths are routed directly
    location ~ ^/(auth|static|project|admin|identity|settings|api|ngdetails|home|header|i18n|jsi18n)(/|$) {
        set $horizon_upstream http://horizon-tunnel:8081;
        proxy_pass $horizon_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Horizon sees plain HTTP, so Django's CSRF check needs a matching Origin
        proxy_set_header Origin http://$host;
        proxy_read_timeout 120s;

        # "/" belongs to the portal here, so send Horizon's own root to its home view
        proxy_redirect ~^/$ /home/;
        sub_filter 'href="/"' 'href="/home/"';

        # sub_filter only works on uncompressed responses
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter 'OpenStack Dashboard' 'Test Cloud';
        sub_filter '</head>' '<link rel="stylesheet" href="/site-assets/horizon-theme.css?v=2"></head>';
    }

    location = /site-assets/horizon-theme.css {
        default_type text/css;
        add_header Cache-Control "public, max-age=300";
        return 200 '
:root { --dc-bg: #0a0c1a; --dc-blue: #4da8ff; --dc-text: #e8eaf6; --dc-muted: #8892aa; --dc-border: rgba(255,255,255,.12); }

/* Login page */
html:has(body#splash) { background: var(--dc-bg); }
body#splash { margin: 0; padding-top: 72px; min-height: 100vh; box-sizing: border-box; background: radial-gradient(circle at 20% 10%, #1a2550 0%, var(--dc-bg) 55%) fixed; color: var(--dc-text); font-family: "Segoe UI", system-ui, sans-serif; }
#splash .splash-logo { display: none; }
#splash .panel { background: rgba(255,255,255,.05); border: 1px solid var(--dc-border); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.5); color: var(--dc-text); overflow: hidden; }
#splash .panel-heading, #splash .panel-footer { background: transparent; border-color: var(--dc-border); color: var(--dc-text); }
#splash .panel-heading::before { content: "Test Cloud"; display: block; margin: 8px 0 4px; font-size: 26px; font-weight: 700; color: #fff; text-align: center; }
#splash .panel-heading::after { content: "OpenStack + Ceph"; display: block; margin-bottom: 4px; font-size: 13px; color: var(--dc-muted); text-align: center; }
#splash .login-title { display: none; }
#splash label { color: var(--dc-text); }
#splash .form-control { background: rgba(0,0,0,.3); border: 1px solid var(--dc-border); color: #fff; box-shadow: none; }
#splash .form-control:focus { border-color: var(--dc-blue); box-shadow: 0 0 0 2px rgba(77,168,255,.25); }
#splash .form-control option { color: #111; }

/* Signed-in pages */
.navbar-default { background: var(--dc-bg); border-color: var(--dc-border); }
.navbar-default .navbar-nav > li > a, .navbar-default .navbar-brand { color: var(--dc-text); }
.navbar-default .navbar-nav > li > a:hover, .navbar-default .navbar-nav > .open > a { background: rgba(255,255,255,.08); color: #fff; }

/* Shared */
.btn-primary { background: var(--dc-blue); border-color: var(--dc-blue); color: #06121f; font-weight: 600; }
.btn-primary:hover, .btn-primary:focus { background: #7cc0ff; border-color: #7cc0ff; color: #06121f; }
';
    }

    location /platformer/ {
        proxy_pass http://platformer/;
        proxy_set_header Host $host;
    }

    location /pokemon/ {
        proxy_pass http://pokemon/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://portal/;
        proxy_set_header Host $host;
    }
}
