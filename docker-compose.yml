services:
  gateway:
    image: nginx:1.27-alpine
    container_name: game-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [portal, platformer, pokemon]
    restart: unless-stopped

  portal:
    build:
      context: ./portal
    image: game-portal:latest
    container_name: game-portal
    restart: unless-stopped

  platformer:
    build:
      context: ./client
    image: dbct-game-client:latest
    container_name: dbct-game-client
    restart: unless-stopped

  pokemon:
    build:
      context: ./pokemon
    image: pokemon-game:latest
    container_name: pokemon-game
    restart: unless-stopped

  cmp:
    build:
      context: ./cmp
    image: cmp:latest
    container_name: cmp
    restart: unless-stopped

  horizon-tunnel:
    build:
      context: ./horizon-tunnel
    image: horizon-tunnel:latest
    container_name: horizon-tunnel
    command: >
      ssh -N -g
      -i /run/secrets/horizon_key
      -o UserKnownHostsFile=/run/secrets/horizon_known_hosts
      -o IdentitiesOnly=yes
      -o BatchMode=yes
      -o ExitOnForwardFailure=yes
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3
      -L 0.0.0.0:8081:192.168.1.61:80
      -L 0.0.0.0:8082:192.168.1.61:5000
      -L 0.0.0.0:8083:192.168.1.61:8774
      -L 0.0.0.0:8084:192.168.1.61:8776
      -L 0.0.0.0:8085:192.168.1.61:9696
      -L 0.0.0.0:8086:192.168.1.61:9292
      root@171.237.178.58
    volumes:
      - ${HOME}/.ssh/horizon_tunnel:/run/secrets/horizon_key:ro
      - ${HOME}/.ssh/horizon_tunnel_known_hosts:/run/secrets/horizon_known_hosts:ro
    restart: unless-stopped
