apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokemon-game
  namespace: games
  labels:
    app: pokemon-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokemon-game
  template:
    metadata:
      labels:
        app: pokemon-game
    spec:
      containers:
        - name: pokemon-game
          image: pokemon-game:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
