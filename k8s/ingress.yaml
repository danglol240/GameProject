apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-ingress
  namespace: games
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
    - http:
        paths:
          - path: /platformer(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dbct-game
                port:
                  number: 80
          - path: /pokemon(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pokemon-game
                port:
                  number: 80
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: game-portal
                port:
                  number: 80
