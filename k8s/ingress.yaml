apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game-ingress
  namespace: games
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    traefik.ingress.kubernetes.io/router.middlewares: games-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: danglol240.id.vn
      http:
        paths:
          - path: /platformer(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: dbct-game
                port:
                  number: 80
          - path: /pokemon(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: pokemon-game
                port:
                  number: 80
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: game-portal
                port:
                  number: 80
