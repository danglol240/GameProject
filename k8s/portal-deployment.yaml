apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-portal
  namespace: games
  labels:
    app: game-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-portal
  template:
    metadata:
      labels:
        app: game-portal
    spec:
      containers:
        - name: game-portal
          image: game-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
